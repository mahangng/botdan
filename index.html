<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود ربات لینکدونی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.7;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(118, 75, 162, 0.4);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(118, 75, 162, 0.55);
        }
        .download-btn:active {
            transform: translateY(0);
        }
        .file-name {
            margin-top: 18px;
            font-size: 12px;
            color: #999;
            direction: ltr;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🤖</div>
        <h1>ربات لینکدونی روبیکا</h1>
        <p>برای دریافت سورس ربات، روی دکمه زیر کلیک کنید.</p>

        <!-- لینک دانلود فایل bot.py -->
        <a href="bot.py" download="bot.py" class="download-btn">
            ⬇️ دانلود فایل
        </a>

        <div class="file-name">bot.py</div>
    </div>
</body>
</html>
